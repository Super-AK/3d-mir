name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build und Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22 installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit-Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Telegram Warnung bei Test-Fehler
        if: failure() && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SAFE_MSG=$(printf '%s' "$MSG" | head -n1 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          TEXT="❌ <b>- 3D-MIR - </b>"$'\n'"<b>CI fehlgeschlagen!</b>"$'\n'"Commit: ${SAFE_MSG}"$'\n'"${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${TEXT}"

  deploy:
    name: Deploy auf Produktionsserver
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy auf Strato VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/3d-mir.de
            # update.sh übernimmt Backup, Rollback, Git-Update, npm ci, Build,
            # Neustart (inkl. automatischer Migrationen), Timer und Health-Check.
            # Der Anwendungsport kommt aus $PORT bzw. /etc/3d-mir/3d-mir.env.
            sudo ./deploy/update.sh

      - name: Webhook-Diagnose (nur mit Marker im Commit)
        if: success() && contains(github.event.head_commit.message, '[webhook-diagnose]')
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== Timer ==="
            systemctl is-active 3d-mir-webhook.timer || true
            systemctl is-enabled 3d-mir-webhook.timer || true
            systemctl list-timers 3d-mir-webhook.timer --no-pager || true
            echo "=== Unit ==="
            systemctl status 3d-mir-webhook.service --no-pager -l || true
            echo "=== Journal ==="
            journalctl -u 3d-mir-webhook.service -n 50 --no-pager || true

      - name: Kunden-Nachtrag (F94, nur mit Marker im Commit)
        if: success() && contains(github.event.head_commit.message, '[backfill-kunden]')
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/3d-mir.de
            sudo deploy/backup.sh
            npm run customers:backfill -- --confirm

      - name: Telegram Erfolgsmeldung
        if: success()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          SAFE_MSG=$(printf '%s' "$MSG" | head -n1 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          TEXT="✅ <b>- 3D-MIR - </b>"$'\n'"<b>Deploy erfolgreich!</b>"$'\n'"Änderung: ${SAFE_MSG}"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${TEXT}"

      - name: Telegram Warnung bei Deploy-Fehler
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT="⚠️ <b>- 3D-MIR - </b>"$'\n'"<b>Deploy auf Produktionsserver fehlgeschlagen!</b>"$'\n'"${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${TEXT}"
